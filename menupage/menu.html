<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>JapExpress Menu</title>
<link rel="stylesheet" href="menu.css">
</head>

<body>

<header>
    <h1>🍣 JapExpress</h1>
    <nav>
        <a href="#">Home</a>
        <a href="#">Menu</a>
        <a href="#">Cart</a>
        <a href="#">Logout</a>
    </nav>
</header>

<section class="menu-container">

    <h2>Our Menu</h2>

    <div class="menu-grid">

        <div class="food-card">
            <img src="images/sushi1.jpg">
            <h3>Salmon Sushi</h3>
            <p>Fresh salmon with sushi rice</p>
            <span>₱220</span>
            <button>Add to Cart</button>
        </div>

        <div class="food-card">
            <img src="images/ramen.jpg">
            <h3>Tonkotsu Ramen</h3>
            <p>Rich pork broth ramen</p>
            <span>₱350</span>
            <button>Add to Cart</button>
        </div>

        <div class="food-card">
            <img src="images/tempura.jpg">
            <h3>Shrimp Tempura</h3>
            <p>Crispy fried shrimp</p>
            <span>₱280</span>
            <button>Add to Cart</button>
        </div>

        <div class="food-card">
            <img src="images/california.jpg">
            <h3>California Roll</h3>
            <p>Crabstick, avocado & cucumber</p>
            <span>₱200</span>
            <button>Add to Cart</button>
        </div>

    </div>

</section>

</body>
</html>
